parameters:
    ibexa.io.dir.root: ''
    kernel.secret: 'foobar'
    # Instead of core's native file handler, whose constructor calls ini_set(), which fails once
    # PHPUnit has printed output. Doctrine's PdoSessionHandlerSchemaListener loads the handler
    # whenever a test builds the ORM schema. Sessions are mocked anyway.
    ibexa.session.handler_id: session.handler.native

framework:
    test: true
    session:
        storage_factory_id: session.storage.factory.mock_file
    cache:
        app: cache.adapter.array
    router:
        resource: '%ibexa.core.test.resource_dir%/config/routes.yaml'

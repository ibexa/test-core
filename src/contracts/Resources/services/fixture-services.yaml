services:
    # repeat part of DIC setup to avoid loading DoctrineSchemaBundle, which is where this
    # alias normally comes from (see its Resources/config/api.yaml)
    Ibexa\Contracts\DoctrineSchema\SchemaAssetsFilterBypassInterface: '@Ibexa\DoctrineSchema\Filter\SchemaAssetsFilterBypass'

    Ibexa\DoctrineSchema\Filter\SchemaAssetsFilterBypass: ~

    Ibexa\Contracts\Core\Test\Persistence\Fixture\FixtureImporter:
        alias: 'test.ibexa.fixture_importer'

    test.ibexa.fixture_importer:
        class: Ibexa\Contracts\Core\Test\Persistence\Fixture\FixtureImporter
        public: true
        arguments:
            $connection: '@ibexa.persistence.connection'


